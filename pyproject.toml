# ───────────────────────────────────────────────────────────
# Uwazi — Python dependencies
# ───────────────────────────────────────────────────────────
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uwazi"
version = "0.1.0"
description = "An agentic AI on MCP that evaluates public tenders for African procurement offices. AI recommends, the officer decides."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Roy Wanyoike", email = "57495194+Roy-Wanyoike@users.noreply.github.com" }
]
keywords = ["mcp", "agentic-ai", "procurement", "tender", "africa", "governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Government",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    # MCP — the protocol layer (v1 FastMCP API)
    "mcp>=1.0.0,<2.0.0",
    # External MCP server we did NOT write — official fetch server
    "mcp-server-fetch>=0.1.0",
    # Open-source orchestration — REQUIRED by the challenge brief
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    # Web layer (review UI)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    # Domain models
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Document ingestion
    "pdfplumber>=0.11.0",
    # Provider-agnostic LLM gateway (works with OpenAI, Qwen via ModelScope, local Llama)
    "openai>=1.30.0",
    "httpx>=0.27.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
uwazi = "uwazi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uwazi = ["py.typed", "web/*.html"]

# Vercel — FastAPI entrypoint hint.
# Vercel's framework detector looks for main.py / app.py / index.py /
# server.py / wsgi.py / asgi.py at the service root. Uwazi's FastAPI
# app lives at src/uwazi/api.py (variable: app). This hint tells Vercel
# where to find it.
[tool.vercel]
entrypoint = "src.uwazi.api:app"

# ───────────────────────────────────────────────────────────
# Ruff — linter + formatter
# ───────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # function call in default argument (FastAPI pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is fine in tests

# ───────────────────────────────────────────────────────────
# Pytest
# ───────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=uwazi --cov-report=term-missing"

# ───────────────────────────────────────────────────────────
# Mypy
# ───────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "mcp.*"]
ignore_missing_imports = true
